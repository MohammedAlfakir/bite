<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BITE burger">
  <!-- Transparent background: the burger sits directly on the browser tab, so
       the art is inset slightly and outlined in ink to stay readable on both
       light and dark tab strips. -->
  <!-- sesame top bun -->
  <path d="M9 28C9 17.5 19.3 10 32 10s23 7.5 23 18H9Z" fill="#FCC419" stroke="#1D0100" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- sesame seeds -->
  <g fill="#1D0100" opacity=".5">
    <ellipse cx="23" cy="20.6" rx="2.1" ry="1.3" transform="rotate(-18 23 20.6)"/>
    <ellipse cx="32.5" cy="17.2" rx="2.1" ry="1.3" transform="rotate(6 32.5 17.2)"/>
    <ellipse cx="42" cy="20.8" rx="2.1" ry="1.3" transform="rotate(20 42 20.8)"/>
  </g>
  <!-- lettuce ruffle -->
  <path d="M7.6 30.6h48.8c0 3-1.9 3.9-4.1 3.9-2.3 0-3-1.7-5.3-1.7s-3.1 2-5.4 2-3-2-5.3-2-3.1 2-5.4 2-3-2-5.3-2-3.1 1.9-5.4 1.9-3-1.9-5.3-1.9c-2.2 0-1.8 1.8-4.1 1.8-2.2 0-3.2-.9-3.2-4Z" fill="#7FB069" stroke="#1D0100" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- cheese slice with drips -->
  <path d="M10 35.2h44c0 3.4-1.6 4.6-3.7 5.3l-1.6 3.8-1.9-3.5-2.7 4.6-2.6-4.6-3 3.9-1.9-3.9H16.6c-4.6 0-6.6-1.8-6.6-5.6Z" fill="#FFD34D" stroke="#1D0100" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- beef patty -->
  <path d="M11.5 41.6h41c1.3 0 2.3 1 2.3 2.3v2.8c0 1.3-1 2.3-2.3 2.3h-41c-1.3 0-2.3-1-2.3-2.3v-2.8c0-1.3 1-2.3 2.3-2.3Z" fill="#8B5A2B" stroke="#1D0100" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- bottom bun -->
  <path d="M10 49.4h44c0 3.9-7.8 6.4-22 6.4s-22-2.5-22-6.4Z" fill="#FCC419" stroke="#1D0100" stroke-width="2.6" stroke-linejoin="round"/>
</svg>
