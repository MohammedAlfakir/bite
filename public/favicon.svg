    <ellipse cx="32.5" cy="17.4" rx="1.9" ry="1.2" transform="rotate(6 32.5 17.4)"/>
    <ellipse cx="41" cy="20.6" rx="1.9" ry="1.2" transform="rotate(20 41 20.6)"/>
  </g>
  <!-- lettuce ruffle -->
  <path d="M11 30.4h42c0 2.6-1.6 3.4-3.5 3.4-2 0-2.6-1.5-4.6-1.5s-2.7 1.7-4.7 1.7-2.6-1.7-4.6-1.7-2.7 1.7-4.7 1.7-2.6-1.7-4.6-1.7-2.7 1.6-4.7 1.6-2.6-1.6-4.6-1.6c-1.9 0-1.5 1.5-3.5 1.5-1.9 0-2.5-.8-2.5-3.4Z" fill="#7FB069"/>
