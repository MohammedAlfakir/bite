  <!-- beef patty -->
  <path d="M14 41h36c1.1 0 2 .9 2 2v2.4c0 1.2-.9 2.1-2 2.1H14c-1.1 0-2-.9-2-2.1V43c0-1.1.9-2 2-2Z" fill="#8B5A2B"/>
  <!-- bottom bun -->
  <path d="M13 48.6h38c0 3.4-6.8 5.6-19 5.6s-19-2.2-19-5.6Z" fill="#FCC419"/>
